<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="마음이 힘든 순간, 당신에게 필요한 따뜻한 한마디를 찾아드립니다."
    >

    <title>마음한줄 | 오늘 당신에게 필요한 말</title>

    <link
        rel="stylesheet"
        href="/style.css"
    >

</head>


<body>

    <div class="background-shape shape-one"></div>
    <div class="background-shape shape-two"></div>


    <main class="container">


        <!-- HEADER -->

        <header class="header">

            <div class="logo">
                마음한줄
            </div>

            <div class="header-badge">
                A LITTLE WORD FOR YOU
            </div>

            <h1>
                오늘, 당신에게<br>
                <span>필요한 한마디</span>
            </h1>

            <p>
                마음이 조금 무거운 날,<br>
                지금의 이야기를 들려주세요.
            </p>

        </header>



        <!-- MAIN -->

        <section class="main-card">


            <div class="question">
                지금 어떤 일이 있었나요?
            </div>


            <div class="question-description">

                잘 정리해서 적지 않아도 괜찮아요.<br>
                생각나는 대로 편하게 적어주세요.

            </div>


            <textarea
                id="situation"
                maxlength="1000"
                placeholder="예를 들어,

오늘 친구랑 조금 다퉜는데
내가 너무 심한 말을 한 것 같아서
계속 마음에 걸려..."
            ></textarea>


            <div class="character-count">

                <span id="characterCount">0</span>
                / 1000

            </div>



            <div class="question emotion-question">
                지금 내 마음은 어떤가요?
            </div>


            <div class="emotions">


                <button
                    class="emotion"
                    data-emotion="슬퍼요"
                >
                    😢
                    <span>슬퍼요</span>
                </button>


                <button
                    class="emotion"
                    data-emotion="지쳤어요"
                >
                    😞
                    <span>지쳤어요</span>
                </button>


                <button
                    class="emotion"
                    data-emotion="답답해요"
                >
                    😣
                    <span>답답해요</span>
                </button>


                <button
                    class="emotion"
                    data-emotion="불안해요"
                >
                    😰
                    <span>불안해요</span>
                </button>


                <button
                    class="emotion"
                    data-emotion="화나요"
                >
                    😡
                    <span>화나요</span>
                </button>


                <button
                    class="emotion"
                    data-emotion="외로워요"
                >
                    🥺
                    <span>외로워요</span>
                </button>


                <button
                    class="emotion"
                    data-emotion="자신감이 없어요"
                >
                    😔
                    <span>자신감이 없어요</span>
                </button>


                <button
                    class="emotion"
                    data-emotion="그냥 그래요"
                >
                    🙂
                    <span>그냥 그래요</span>
                </button>


            </div>



            <button
                id="goodWordButton"
                class="main-button"
            >

                <span class="button-icon">
                    ✦
                </span>

                <span>
                    나에게 필요한 말 받기
                </span>

            </button>



            <!-- RESULT -->

            <div
                id="result"
                class="result"
            >

                <div class="result-top">

                    <span>✦</span>

                    지금 당신에게 전하고 싶은 말

                    <span>✦</span>

                </div>


                <div
                    id="message"
                    class="message"
                ></div>


                <div class="result-actions">

                    <button
                        id="anotherButton"
                        class="another-button"
                    >
                        다른 말 하나 더
                    </button>


                    <button
                        id="copyButton"
                        class="copy-button"
                    >
                        문장 복사
                    </button>

                </div>

            </div>


        </section>



        <!-- NOTICE -->

        <section class="notice">

            <div class="notice-icon">
                ♡
            </div>


            <div>

                <strong>
                    당신의 마음은 소중해요.
                </strong>


                <p>
                    모든 것을 지금 당장 해결하지 않아도 괜찮아요.
                    잠시 쉬어가도 충분합니다.
                </p>

            </div>

        </section>



        <!-- FOOTER -->

        <footer>

            <p>
                마음한줄
            </p>

            <span>
                오늘도 당신의 하루를 응원합니다.
            </span>

        </footer>


    </main>



    <div
        id="toast"
        class="toast"
    >
        문장이 복사되었어요.
    </div>



    <script src="/script.js"></script>

</body>

</html>
